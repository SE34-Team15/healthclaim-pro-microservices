# Kubernetes Ingress Configuration for HealthClaim Pro Cloud
# Supports: cloud.healthclaim.pro / ms.healthclaim.pro / microservices.healthclaim.pro
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthclaim-ingress
  namespace: healthclaim
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - cloud.healthclaim.pro
        - ms.healthclaim.pro
        - microservices.healthclaim.pro
      secretName: healthclaim-tls-cert
  rules:
    - host: cloud.healthclaim.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    - host: ms.healthclaim.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    - host: microservices.healthclaim.pro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
