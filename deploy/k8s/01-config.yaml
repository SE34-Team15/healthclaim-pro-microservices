apiVersion: v1
kind: Namespace
metadata:
  name: healthclaim
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthclaim-config
  namespace: healthclaim
data:
  NODE_ENV: "production"
  API_PREFIX: "/api/v1"
  PORT: "3000"
  REDIS_URL: "redis://healthclaim-redis:6379"
  RABBITMQ_URL: "amqp://healthclaim_mq:healthclaim_mq_pass@healthclaim-rabbitmq:5672"
  RABBITMQ_EXCHANGE: "healthclaim.events"
  CLAIM_SERVICE_URL: "http://claim-service:3001"
  RULE_ENGINE_SERVICE_URL: "http://rule-engine-service:3002"
  ACTUARIAL_SERVICE_URL: "http://actuarial-service:3003"
  S3_ENDPOINT: "http://healthclaim-minio:9000"
  S3_BUCKET_NAME: "healthclaim-receipts"
  S3_SETTLEMENT_BUCKET: "healthclaim-settlements"
---
apiVersion: v1
kind: Secret
metadata:
  name: healthclaim-secrets
  namespace: healthclaim
type: Opaque
stringData:
  DATABASE_URL: "postgresql://healthclaim_user:healthclaim_pass@healthclaim-postgres:5432/healthclaim_db?schema=public"
  JWT_SECRET: "super_secret_healthclaim_pro_jwt_key_development_2026!"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
