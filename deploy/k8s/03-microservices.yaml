# 4. Asynchronous Settlement Background Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: healthclaim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-worker
  template:
    metadata:
      labels:
        app: settlement-worker
    spec:
      containers:
        - name: settlement-worker
          image: healthclaim-microservice:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/entrypoints/settlement-worker.js"]
          envFrom:
            - configMapRef:
                name: healthclaim-config
            - secretRef:
                name: healthclaim-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
