# 1. Claim Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-service
  namespace: healthclaim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claim-service
  template:
    metadata:
      labels:
        app: claim-service
    spec:
      containers:
        - name: claim-service
          image: healthclaim-microservice:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/entrypoints/claim-service.js"]
          envFrom:
            - configMapRef:
                name: healthclaim-config
            - secretRef:
                name: healthclaim-secrets
          env:
            - name: PORT
              value: "3001"
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: claim-service
  namespace: healthclaim
spec:
  selector:
    app: claim-service
  ports:
    - port: 3001
      targetPort: 3001
---
