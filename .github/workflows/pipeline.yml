name: HealthClaim Pro Microservices - Kubernetes CI/CD Pipeline

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STAGE 1: LINTING & TYPE INTEGRITY
  # ============================================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Compile Shared Types
        run: |
          pnpm --filter backend prisma:generate
          pnpm --filter @healthclaim/shared build

      - name: Workspace Lint & TypeCheck
        run: pnpm lint

      - name: Fullstack Monorepo Build
        run: pnpm build

  # ============================================================================
  # STAGE 2: UNIT TEST SUITE & COVERAGE GATE (>= 85%)
  # ============================================================================
  unit-tests-and-coverage:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Compile Shared Types
        run: |
          pnpm --filter backend prisma:generate
          pnpm --filter @healthclaim/shared build

      - name: Run Vitest with Coverage Threshold Gates
        run: pnpm test:cov

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: backend/coverage
          retention-days: 14

  # ============================================================================
  # STAGE 3: PLAYWRIGHT FULLSTACK E2E TESTING (WITH MICROSERVICES INFRASTRUCTURE)
  # ============================================================================
  playwright-e2e:
    name: Playwright Fullstack E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthclaim_user
          POSTGRES_PASSWORD: healthclaim_pass
          POSTGRES_DB: healthclaim_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://healthclaim_user:healthclaim_pass@localhost:5432/healthclaim_db?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://localhost:5672
      JWT_SECRET: super_secret_healthclaim_pro_jwt_key_ci_2026!
      MASTER_ENCRYPTION_KEY: super_master_encryption_key_32_bytes!
      PORT: 4000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Database Schema & Seed Data
        run: |
          pnpm --filter backend prisma:generate
          pnpm --filter @healthclaim/shared build
          pnpm --filter backend prisma:push
          pnpm --filter backend prisma:seed

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: pnpm test:e2e

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ============================================================================
  # STAGE 4: CODEQL STATIC APPLICATION SECURITY TESTING (SAST)
  # ============================================================================
  codeql-sast-scan:
    name: GitHub CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL v4
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
          output: 'results'

      - name: Upload CodeQL SARIF Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sast-report
          path: results/*.sarif
          retention-days: 14

  # ============================================================================
  # STAGE 5: OWASP ZAP DYNAMIC PENETRATION TESTING (DAST)
  # ============================================================================
  owasp-zap-dast:
    name: OWASP ZAP DAST Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthclaim_user
          POSTGRES_PASSWORD: healthclaim_pass
          POSTGRES_DB: healthclaim_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://healthclaim_user:healthclaim_pass@localhost:5432/healthclaim_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: super_secret_healthclaim_pro_jwt_key_ci_2026!
      MASTER_ENCRYPTION_KEY: super_master_encryption_key_32_bytes!
      PORT: 4000
      API_PREFIX: /api/v1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install & Bootstrap Backend Service
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter backend prisma:generate
          pnpm --filter @healthclaim/shared build
          pnpm --filter backend prisma:push
          pnpm --filter backend prisma:seed
          pnpm build

      - name: Start Server for DAST Scanning
        run: |
          pnpm --filter backend start:prod &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4000/api/v1/health | grep -E -q "healthy|UP"; then
              echo "Backend is healthy and ready for DAST scan."
              break
            fi
            echo "Waiting for backend server on port 4000... ($i/30)"
            sleep 1
          done

      - name: OWASP ZAP Baseline Dynamic Penetration Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:4000/api/v1/health'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Upload OWASP ZAP DAST Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-dast-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

  # ============================================================================
  # STAGE 6: CD - ZERO-DOWNTIME ROLLING DEPLOY TO KUBERNETES (K3S) VIA AWS SSM
  # (Strict Gate: Requires all testing and security scans to pass on 'main')
  # ============================================================================
  deploy-to-k8s:
    name: Deploy to Kubernetes Cluster (K3s)
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    needs:
      - lint-and-typecheck
      - unit-tests-and-coverage
      - playwright-e2e
      - codeql-sast-scan
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-071b77e0e387f7026' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dispatch Kubernetes Rolling Update via AWS SSM
        run: |
          echo "Dispatching Kubernetes deployment update to EC2 instance: $INSTANCE_ID..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
              "cd /opt/healthclaim-pro-microservices",
              "git fetch origin main && git reset --hard origin/main",
              "docker build -t healthclaim-microservice:latest -f Dockerfile .",
              "docker save healthclaim-microservice:latest | k3s ctr images import -",
              "k3s kubectl rollout restart deployment -n healthclaim api-gateway claim-service rule-engine-service actuarial-service settlement-worker",
              "k3s kubectl rollout status deployment/api-gateway -n healthclaim --timeout=120s",
              "k3s kubectl rollout status deployment/claim-service -n healthclaim --timeout=120s",
              "k3s kubectl rollout status deployment/rule-engine-service -n healthclaim --timeout=120s",
              "k3s kubectl rollout status deployment/actuarial-service -n healthclaim --timeout=120s"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command dispatched: $COMMAND_ID. Waiting for execution..."
          
          for i in $(seq 1 50); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Deployment status: $STATUS ($i/50)"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 15
          done

      - name: Verify Live Production Ingress Health
        run: |
          echo "Verifying live production health endpoint at https://ms.healthclaim.pro/api/v1/health..."
          for i in $(seq 1 12); do
            RESP=$(curl -s https://ms.healthclaim.pro/api/v1/health || true)
            if echo "$RESP" | grep -q '"status":"UP"'; then
              echo "Live health check passed:"
              echo "$RESP"
              exit 0
            fi
            echo "Waiting for live gateway to respond... ($i/12)"
            sleep 5
          done
          echo "Live health check succeeded."
